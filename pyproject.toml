[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irispark"
version = "1.6.0"
description = "PySpark-like analytics engine for InterSystems IRIS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "intersystems-irispython",
    "pandas",
    "pyarrow",
    "python-dotenv",
]

[project.optional-dependencies]
polars = ["polars"]
jdbc = ["sqlalchemy"]
dask = ["dask[dataframe]"]
jupyter = ["jupyter", "ipykernel"]
test = ["pytest"]
dev = ["pytest", "mypy", "ruff", "polars", "sqlalchemy", "dask[dataframe]"]
all = ["polars", "sqlalchemy", "dask[dataframe]", "jupyter", "ipykernel"]

[project.urls]
Homepage = "https://github.com/irispark/irispark-mvp"

[project.scripts]
irispark-doctor = "irispark.doctor:run"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF100"]
ignore = ["E501", "N999", "N802", "N803", "N806", "N815", "N816"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
markers = [
    "online: requires a live IRIS connection",
    "offline: does not require IRIS",
    "volume: volume benchmark (1M–100M rows)",
]
addopts = "-m 'not online'"

[tool.setuptools]
packages = ["irispark", "irispark.sql", "irispark.sql.udf", "irispark.ml"]
